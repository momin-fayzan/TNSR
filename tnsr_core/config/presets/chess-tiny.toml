# Tiny chess model for tests and smoke runs (seconds on CPU).
name = "chess-tiny"
description = "Tiny chess action-value smoke-test model"
task = "chess"

[model]
n_layer = 2
n_head = 2
n_embd = 32
dropout = 0.0

[data]
dataset = "chess-demo"
value_bins = 32
mate_classes = 4

[train]
device = "cpu"
batch_size = 64
max_steps = 20
learning_rate = 1e-3
min_lr = 1e-4
warmup_steps = 2
eval_interval = 10
eval_iters = 2
log_interval = 5
keep_checkpoints = 2
