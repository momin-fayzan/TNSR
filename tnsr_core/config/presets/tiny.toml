# Tiny configuration for unit tests and smoke runs (seconds on CPU).
name = "tiny"
description = "Tiny CPU smoke-test model"

[model]
block_size = 32
n_layer = 2
n_head = 2
n_embd = 32
dropout = 0.0

[data]
dataset = "demo"

[train]
device = "cpu"
batch_size = 4
max_steps = 20
learning_rate = 3e-3
min_lr = 3e-4
warmup_steps = 2
eval_interval = 10
eval_iters = 2
log_interval = 5
keep_checkpoints = 2
