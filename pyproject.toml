[project]
name = "tnsr"
version = "0.1.0"
description = "TNSR: a from-scratch decoder-only Transformer with training pipeline, inference engine, experiment lab and chat studio."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5,<3",
    "numpy>=1.26,<3",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "psutil>=5.9,<8",
    "chess>=1.11,<2",
    "zstandard>=0.22,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
tnsr = "tnsr_core.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tnsr_core", "tnsr_server"]

# On Linux/Windows pull the CPU-only PyTorch wheel (small, no CUDA download).
# On macOS the regular PyPI wheel is used, which includes Apple Silicon MPS support.
# Users with NVIDIA GPUs can install a CUDA wheel manually (see docs/troubleshooting.md).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: longer-running training/benchmark tests (run with -m slow)",
]
timeout = 300
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tnsr_ui", "experiments", "checkpoints", "datasets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
files = ["tnsr_core", "tnsr_server"]
plugins = ["pydantic.mypy"]
